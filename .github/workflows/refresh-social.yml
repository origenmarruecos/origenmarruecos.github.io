name: Refresh social metadata

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-social.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build valid social preview image
        run: |
          sudo apt-get update -y
          sudo apt-get install -y imagemagick fonts-dejavu-core
          convert -size 1200x630 xc:'#F2EBDD' \
            -fill '#111512' -draw 'rectangle 0,0 1200,92' \
            -fill '#C1272D' -draw 'rectangle 0,92 1200,110' \
            -font DejaVu-Sans-Bold -fill '#F2EBDD' -pointsize 34 -annotate +60+61 'ORIGEN MARRUECOS' \
            -fill '#C1272D' -pointsize 58 -annotate +1080+67 '★' \
            -fill '#111512' -pointsize 92 -annotate +58+245 'ORIGEN' \
            -fill '#C1272D' -pointsize 106 -annotate +55+355 'MARRUECOS' \
            -fill '#111512' -pointsize 35 -annotate +60+435 'SE VOTA CON LA CARTERA' \
            -font DejaVu-Sans -fill '#5F5A52' -pointsize 27 -annotate +60+500 'Consulta y escanea productos vendidos en España' \
            -annotate +60+540 'con origen o elaboración documentados en Marruecos.' \
            -strip -quality 82 \
            assets/social/origen-marruecos-share-1200x630-v3.jpg

      - name: Update social metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          new = 'https://origenmarruecos.github.io/assets/social/origen-marruecos-share-1200x630-v3.jpg'

          for name in ('index.html', 'manifiesto.html'):
              p = Path(name)
              s = p.read_text(encoding='utf-8')

              s = re.sub(r'<meta property="og:image" content="[^"]+">',
                         f'<meta property="og:image" content="{new}">', s)
              s = re.sub(r'\n?<meta property="og:image:secure_url" content="[^"]+">', '', s)
              s = re.sub(r'<meta property="og:image:width" content="[^"]+">',
                         '<meta property="og:image:width" content="1200">', s)
              s = re.sub(r'<meta property="og:image:height" content="[^"]+">',
                         '<meta property="og:image:height" content="630">', s)
              s = re.sub(r'<meta name="twitter:image" content="[^"]+">',
                         f'<meta name="twitter:image" content="{new}">', s)
              s = re.sub(r'<link rel="image_src" href="[^"]+">',
                         f'<link rel="image_src" href="{new}">', s)

              if 'property="og:image:url"' not in s:
                  marker = f'<meta property="og:image" content="{new}">'
                  s = s.replace(marker, marker + f'\n<meta property="og:image:url" content="{new}">')

              p.write_text(s, encoding='utf-8')
          PY

      - name: Verify generated asset
        run: |
          identify assets/social/origen-marruecos-share-1200x630-v3.jpg
          test $(stat -c%s assets/social/origen-marruecos-share-1200x630-v3.jpg) -lt 300000

      - name: Commit metadata update
        run: |
          git config user.name "origenmarruecos"
          git config user.email "327055556+origenmarruecos@users.noreply.github.com"
          git add index.html manifiesto.html assets/social/origen-marruecos-share-1200x630-v3.jpg
          git diff --cached --quiet && exit 0
          git commit -m "Corregir miniaturas de enlaces y metadatos sociales"
          git push
