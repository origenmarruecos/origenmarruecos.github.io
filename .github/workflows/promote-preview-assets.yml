name: Promote preview assets

on:
  push:
    paths:
      - '.github/workflows/promote-preview-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production
        uses: actions/checkout@v4

      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          repository: origenmarruecos/om-preview-8f4a2
          path: _preview

      - name: Copy approved preview assets
        run: |
          mkdir -p assets/products assets/logos
          cp -a _preview/assets/products/. assets/products/
          cp -a _preview/assets/logos/. assets/logos/
          cp _preview/scanner.js scanner.js
          cp _preview/scanner.css scanner.css
          cp _preview/verified-barcodes.js verified-barcodes.js
          rm -rf _preview

      - name: Commit promoted assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/products assets/logos scanner.js scanner.css verified-barcodes.js
          if git diff --cached --quiet; then
            echo "No asset changes to promote."
          else
            git commit -m "Promover imágenes y escáner aprobados desde prototipo"
            git push
          fi
