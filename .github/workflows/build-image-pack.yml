name: Fix favicon and site name

on:
  push:
    branches:
      - tmp-image-pack-20260916

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fix favicon declarations and site name metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [Path('index.html'), Path('manifiesto.html'), Path('reacciones.html'), Path('legal-privacidad.html')]
          old = '<link rel="icon" href="/favicon.svg" type="image/svg+xml">\n<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">'
          new = '<link rel="icon" href="/favicon.ico">\n<link rel="icon" href="/favicon-32.png" sizes="96x96" type="image/png">'

          for p in files:
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'Expected favicon block not found in {p}')
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<link rel="manifest" href="/site.webmanifest">'
          schema = '''<link rel="manifest" href="/site.webmanifest">\n<script type="application/ld+json">\n{\n  "@context": "https://schema.org",\n  "@type": "WebSite",\n  "name": "ORIGEN MARRUECOS",\n  "alternateName": ["Origen Marruecos", "origenmarruecos.github.io"],\n  "url": "https://origenmarruecos.github.io/"\n}\n</script>'''
          if '"@type": "WebSite"' not in s:
              if marker not in s:
                  raise SystemExit('Manifest marker not found in index.html')
              s = s.replace(marker, schema, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit to production
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'origenmarruecos'
          git config user.email '327055556+origenmarruecos@users.noreply.github.com'
          git add index.html manifiesto.html reacciones.html legal-privacidad.html
          git commit -m 'Corrige favicon para Google y nombre del sitio'
          git push origin HEAD:main
