name: Internalize supermarket logos

on:
  push:
    branches:
      - tmp-image-pack-20260916

permissions:
  contents: write

jobs:
  internalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download Eroski and Hipercor logos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/logos
          curl -L --fail --retry 3 'https://upload.wikimedia.org/wikipedia/commons/1/13/Eroski_logo.svg' -o assets/logos/eroski.svg
          curl -L --fail --retry 3 'https://upload.wikimedia.org/wikipedia/commons/f/fa/Hipercor_logo.svg' -o assets/logos/hipercor.svg
          test -s assets/logos/eroski.svg
          test -s assets/logos/hipercor.svg

      - name: Point every supermarket logo to local assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.js')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'https://commons.wikimedia.org/wiki/Special:Redirect/file/Mercadona.svg': 'assets/logos/mercadona.svg',
              'https://upload.wikimedia.org/wikipedia/commons/5/5b/Carrefour_logo.svg': 'assets/logos/carrefour.png',
              'https://commons.wikimedia.org/wiki/Special:Redirect/file/Alcampo.png': 'assets/logos/alcampo.png',
              'https://commons.wikimedia.org/wiki/Special:Redirect/file/Lidl-Logo.svg': 'assets/logos/lidl.svg',
              'https://commons.wikimedia.org/wiki/Special:Redirect/file/AldiNord-WorldwideLogo.svg': 'assets/logos/aldi.svg',
              'https://commons.wikimedia.org/wiki/Special:Redirect/file/Dia_2019.svg': 'assets/logos/dia.svg',
              'https://commons.wikimedia.org/wiki/Special:Redirect/file/Eroski_logo.svg': 'assets/logos/eroski.svg',
              'https://commons.wikimedia.org/wiki/Special:Redirect/file/Hipercor_logo.svg': 'assets/logos/hipercor.svg',
          }
          missing = [old for old in replacements if old not in s]
          if missing:
              raise SystemExit(f'Expected logo URLs not found in app.js: {missing}')
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit to production
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'origenmarruecos'
          git config user.email '327055556+origenmarruecos@users.noreply.github.com'
          git add app.js assets/logos/eroski.svg assets/logos/hipercor.svg
          git diff --cached --check
          git commit -m 'Internaliza logos de supermercados'
          git push origin HEAD:main
