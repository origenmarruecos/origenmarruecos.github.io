name: Make Ceuta fly dismissible

on:
  push:
    branches:
      - tmp-image-pack-20260916

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Convert floating Ceuta badge into a clickable dismissible element
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path = Path('scanner.css')
          css = css_path.read_text(encoding='utf-8')

          if 'body::after{' not in css:
              raise SystemExit('Ceuta pseudo-element not found in scanner.css')

          css = css.replace('body::after{', '.ceuta-fly{')

          old = '''  pointer-events:none;\n  will-change:transform,opacity;'''
          new = '''  pointer-events:auto;\n  cursor:pointer;\n  border:0;\n  padding:0;\n  appearance:none;\n  -webkit-appearance:none;\n  -webkit-tap-highlight-color:transparent;\n  will-change:transform,opacity;'''
          if old not in css:
              raise SystemExit('Expected pointer-events block not found in scanner.css')
          css = css.replace(old, new, 1)

          extra_css = '''\n.ceuta-fly.is-hiding{\n  animation:ceuta-fly-swing 1150ms cubic-bezier(.22,.9,.24,1) 0ms reverse both;\n  pointer-events:none;\n}\n.ceuta-fly[hidden]{display:none!important}\n.ceuta-fly:focus-visible{outline:3px solid var(--green);outline-offset:-3px}\n@media(prefers-reduced-motion:reduce){\n  .ceuta-fly.is-hiding{opacity:0;transform:translate(34%,108%) rotate(18deg) scale(.82)}\n}\n'''
          if '.ceuta-fly.is-hiding{' not in css:
              css += extra_css
          css_path.write_text(css, encoding='utf-8')

          app_path = Path('app.js')
          app = app_path.read_text(encoding='utf-8')
          if 'function initCeutaFly()' in app:
              raise SystemExit('Ceuta fly handler already exists in app.js')

          app += '''\n\nfunction initCeutaFly(){\n  if(document.querySelector(".ceuta-fly")) return;\n  const fly = document.createElement("button");\n  fly.type = "button";\n  fly.className = "ceuta-fly";\n  fly.setAttribute("aria-label", "Ocultar distintivo de apoyo a Ceuta");\n  fly.title = "Ocultar";\n  document.body.appendChild(fly);\n\n  fly.addEventListener("click", () => {\n    if(fly.hidden || fly.classList.contains("is-hiding")) return;\n    const reducedMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;\n    if(reducedMotion){\n      fly.hidden = true;\n      return;\n    }\n    fly.classList.add("is-hiding");\n    fly.addEventListener("animationend", () => { fly.hidden = true; }, {once:true});\n  });\n}\n\ninitCeutaFly();\n'''
          app_path.write_text(app, encoding='utf-8')
          PY

      - name: Commit to production
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'origenmarruecos'
          git config user.email '327055556+origenmarruecos@users.noreply.github.com'
          git add scanner.css app.js
          git commit -m 'Permite ocultar la mosca de Ceuta al pulsarla'
          git push origin HEAD:main
